<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Personal Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #58a6ff 0%, #7ee787 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .config-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1 1 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #c9d1d9;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            margin-bottom: 0;
        }

        .btn-generate {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4);
        }

        .btn-generate:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #8b949e;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid #f85149;
            color: #f85149;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard {
            display: grid;
            gap: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #58a6ff;
        }

        .svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        .svg-container svg {
            max-width: 100%;
            height: auto;
        }

        @media (min-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐙 GitHub Personal Dashboard</h1>
            <p>生成你的 GitHub 个人数据可视化</p>
        </div>

        <div class="config-card">
            <form id="config-form">
                <div class="config-row">
                    <div class="form-group">
                        <label for="username">GitHub 用户名 *</label>
                        <input type="text" id="username" placeholder="octocat" required>
                    </div>
                    <div class="form-group">
                        <label for="token">Personal Access Token (可选)</label>
                        <input type="text" id="token" placeholder="ghp_xxx">
                    </div>
                    <div class="form-group">
                        <label for="theme">主题</label>
                        <select id="theme">
                            <option value="dark">深色 (Dark)</option>
                            <option value="light">浅色 (Light)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="year">年份 (可选)</label>
                        <input type="number" id="year" placeholder="2025" min="2010" max="2030">
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="no_forks">
                    <label for="no_forks">不统计 Fork 的仓库</label>
                </div>
                <button type="submit" class="btn-generate" style="margin-top: 20px;">
                    生成 Dashboard
                </button>
            </form>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>正在获取数据并生成可视化...</p>
            <p style="font-size: 0.85rem; color: #6e7681;">这可能需要几秒钟时间</p>
        </div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <div class="card" style="grid-column: 1 / -1;">
                <h3>👤 个人信息</h3>
                <div class="svg-container" id="profile-svg"></div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h3>🔥 贡献热力图</h3>
                <div class="svg-container" id="heatmap-svg"></div>
            </div>
            <div class="card">
                <h3>🛠️ 语言统计</h3>
                <div class="svg-container" id="languages-svg"></div>
            </div>
            <div class="card">
                <h3>📈 活跃度趋势</h3>
                <div class="svg-container" id="activity-svg"></div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h3>⭐ 热门仓库</h3>
                <div class="svg-container" id="repo-svg"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("config-form");
        const loadingDiv = document.getElementById("loading");
        const errorDiv = document.getElementById("error");
        const dashboardDiv = document.getElementById("dashboard");
        const generateBtn = document.querySelector(".btn-generate");

        const svgContainers = {
            profile: document.getElementById("profile-svg"),
            heatmap: document.getElementById("heatmap-svg"),
            languages: document.getElementById("languages-svg"),
            activity: document.getElementById("activity-svg"),
            repo: document.getElementById("repo-svg")
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append("username", document.getElementById("username").value.trim());
            formData.append("token", document.getElementById("token").value.trim());
            formData.append("theme", document.getElementById("theme").value);
            formData.append("year", document.getElementById("year").value.trim());
            formData.append("no_forks", document.getElementById("no_forks").checked ? "true" : "false");

            errorDiv.style.display = "none";
            loadingDiv.style.display = "block";
            dashboardDiv.style.display = "none";
            generateBtn.disabled = true;

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "未知错误");
                }

                for (const [key, value] of Object.entries(result)) {
                    if (value) {
                        svgContainers[key].innerHTML = value;
                    } else {
                        svgContainers[key].innerHTML = `<p style="color: #8b949e;">暂无数据</p>`;
                    }
                }

                loadingDiv.style.display = "none";
                dashboardDiv.style.display = "grid";
            } catch (err) {
                errorDiv.textContent = "错误: " + err.message;
                errorDiv.style.display = "block";
                loadingDiv.style.display = "none";
            } finally {
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
